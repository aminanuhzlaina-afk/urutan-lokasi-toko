<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kunjungan Solok</title>
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#18222d;--mut:#5d6b7a;--pri:#1F4E78;--acc:#0b8f5a;--line:#dfe5ec;--chip:#e6eef7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#1a232d;--tx:#e8eef5;--mut:#97a6b6;--pri:#5aa2e0;--acc:#34c48a;--line:#2a3643;--chip:#25384c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#1F4E78;color:#fff;padding:18px 16px 16px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.go{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:18px;font-weight:700;padding:16px;text-align:center;text-decoration:none}
.go[aria-disabled=true]{background:var(--mut);pointer-events:none}
.sub{color:var(--mut);font-size:13px;margin:8px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.card.done{opacity:.55}
.card.next{border:2px solid var(--acc)}
.no{flex:0 0 36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.body{flex:1;min-width:0}
.nm{font-weight:700}
.ow{color:var(--mut);font-size:14px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;font-size:12px;padding:2px 9px;margin-top:6px}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:20px;font-size:12px;padding:2px 9px;margin:6px 0 0 6px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.nav{background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;font-size:15px}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut)}
.chk input{width:20px;height:20px}
.reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<header><h1>Kunjungan Solok</h1><p>10 toko berurutan dari Padang · ketuk untuk buka titik di Maps</p></header>
<main>
<a id="go" class="go" href="#">Buka toko berikutnya</a>
<p class="sub" id="sub"></p>
<div id="list"></div>
<button class="reset" id="reset">Atur ulang tanda kunjungan</button>
</main>
<script>
const STORES=[
{id:'SLK-PMO-NON-001',n:'PEN MOTOR',o:'Pendika Alfitra',a:'Kabupaten Solok',lat:-0.930361,lng:100.622013},
{id:'SLK-ASE-NON-001',n:'ASEAN MOTOR',o:'Markanedi',a:'Kabupaten Solok',lat:-0.862927,lng:100.647548},
{id:'SLK-RAM-NON-001',n:'RA MOTOR',o:'Rovie Andilla',a:'Kabupaten Solok',lat:-0.853072,lng:100.690062},
{id:'SLK-RIV-NON-001',n:'RIVA MOTOR',o:'Nanda Adiaksa',a:'Kabupaten Solok',lat:-0.81365,lng:100.68065},
{id:'SLK-HLM-NON-001',n:'HALABAN MOTOR',o:'Alberd Julianda',a:'Kabupaten Solok',lat:-0.812188,lng:100.679831},
{id:'SLK-JAL-ASR-002',n:'JALAL RAHMAT',o:'',a:'Kota Solok',lat:-0.799494,lng:100.665911},
{id:'SLK-DEM-NON-001',n:'DENI MOTOR',o:'Deni Saputra',a:'Kota Solok',lat:-0.793577,lng:100.659812},
{id:'SLK-ARM-ADR-003',n:'ARMADI',o:'Roberto Akda Karisma',a:'Kota Solok',lat:-0.79258,lng:100.65851},
{id:'SLK-FNU-ABA-001',n:'FAJRI NUR',o:'Hendra Defitri',a:'Kota Solok',lat:-0.789588,lng:100.658946},
{id:'SLK-YRS-SNR-004',n:'AHMAD ARIANDI',o:'',a:'Kota Solok',lat:-0.789643,lng:100.658179}
];
const KEY='kunjungan-solok-v1';
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]));}catch(e){}};
const ll=s=>s.lat+','+s.lng;
const pinUrl=s=>'https://www.google.com/maps/search/?api=1&query='+ll(s);
function render(){
  const rem=STORES.filter(s=>!done.has(s.id));
  const go=document.getElementById('go'),sub=document.getElementById('sub');
  if(!rem.length){go.textContent='Semua toko sudah dikunjungi';go.setAttribute('aria-disabled','true');go.removeAttribute('href');sub.textContent='';}
  else{
    go.removeAttribute('aria-disabled');
    go.href=pinUrl(rem[0]);
    go.textContent='Buka toko berikutnya: '+rem[0].n;
    sub.textContent='Satu ketukan langsung menampilkan titik toko di Google Maps, tanpa rute dari lokasi Anda.';
  }
  const nextId=rem.length?rem[0].id:null, list=document.getElementById('list');
  list.textContent='';
  STORES.forEach((s,i)=>{
    const d=done.has(s.id),c=document.createElement('div');
    c.className='card'+(d?' done':'')+(s.id===nextId?' next':'');
    c.innerHTML='<div class="no"></div><div class="body"><div class="nm"></div><div class="ow"></div><span class="chip"></span><span class="tag" hidden>Berikutnya</span><div class="row"><a class="nav" target="_self">Buka titik di Maps</a><label class="chk"><input type="checkbox"> Sudah dikunjungi</label></div></div>';
    c.querySelector('.no').textContent=i+1;
    c.querySelector('.nm').textContent=s.n;
    c.querySelector('.ow').textContent=s.o||s.id;
    c.querySelector('.chip').textContent=s.a;
    c.querySelector('.tag').hidden=s.id!==nextId;
    c.querySelector('.nav').href=pinUrl(s);
    const cb=c.querySelector('input');cb.checked=d;
    cb.onchange=()=>{cb.checked?done.add(s.id):done.delete(s.id);save();render();};
    list.appendChild(c);
  });
}
document.getElementById('reset').onclick=()=>{done.clear();save();render();};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
